name: senac-helpdesk

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    image: senac-helpdesk:cli-1.0.0
    command: "npx prisma migrate deploy"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: no

  seed:
    image: senac-helpdesk:cli-1.0.0
    command: "npx prisma db seed"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: no

  app:
    image: senac-helpdesk:app-1.0.0
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-prod:


